[package]
name = "keo-companion"
version = "0.1.0"
description = "Keo Companion: connects Keo to the coding agents on this machine"
authors = ["Upwage"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "keo_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "time", "process", "sync", "io-util", "macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
semver = "1"
url = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dunce = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
